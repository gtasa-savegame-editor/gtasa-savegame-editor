name: macOS

on:
  release:
    types: [released, prereleased]

jobs:
  dmg:
    name: 🍏 .app/.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: 'maven'
      - name: Build app and dmg
        run: mvn clean install -Dmaven.javadoc.skip=true -B -V -PmacOS
      - name: Package dmg
        run: |
          mkdir deploy
          cp -v savegame-editor/target/*.dmg deploy/
          zip -r "GTA:SA-Savegame-Editor.macOS.zip" deploy/
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GTA:SA-Savegame-Editor.macOS.zip
