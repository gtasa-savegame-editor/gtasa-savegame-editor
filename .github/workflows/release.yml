name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  jar:
    name: 🐧 .jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: 'maven'
      - name: Build jar
        run: mvn clean install -Dmaven.javadoc.skip=true -B -V
      - name: Package jar
        run: |
          mkdir deploy
          cp -v savegame-editor/target/*-jar-with-dependencies.jar deploy/
          zip -r "GTA-SA-Savegame-Editor.jar.zip" deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: GTA-SA-Savegame-Editor.jar.zip

  deb:
    name: 🐧 .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: 'maven'
      - name: Build deb
        run: mvn clean install -Pdeb -Dmaven.javadoc.skip=true -B -V
      - name: Package deb
        run: |
          mkdir deploy
          cp -v savegame-editor/target/*.deb deploy/
          zip -r "GTA-SA-Savegame-Editor.deb.zip" deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: GTA-SA-Savegame-Editor.deb.zip

  rpm:
    name: 🐧 .rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: 'maven'
      - name: Build rpm
        run: mvn clean install -Prpm -Dmaven.javadoc.skip=true -B -V
      - name: Package rpm
        run: |
          mkdir deploy
          cp -v savegame-editor/target/rpm/savegame-editor/RPMS/noarch/*.rpm deploy/
          zip -r "GTA-SA-Savegame-Editor.rpm.zip" deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: GTA-SA-Savegame-Editor.rpm.zip

  dmg:
    name: 🍏 .app/.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: 'maven'
      - name: Build app and dmg
        run: mvn clean install -Dmaven.javadoc.skip=true -B -V -PmacOS
      - name: Package dmg
        run: |
          mkdir deploy
          cp -v savegame-editor/target/*.dmg deploy/
          zip -r "GTA-SA-Savegame-Editor.macOS.zip" deploy/
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: GTA-SA-Savegame-Editor.macOS.zip

  exe:
    name: 🏢 .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: 'maven'
      - name: Install WiX Toolset
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath C:\WiX
          echo "C:\WiX" >> $env:GITHUB_PATH
      - name: Build exe
        run: mvn clean install -Pdeb "-Dmaven.javadoc.skip=true" -B -V -Pwindows
      - name: Package exe
        run: |
          mkdir deploy
          copy savegame-editor\target\*.exe deploy\
          Compress-Archive deploy GTA-SA-Savegame-Editor.Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: GTA-SA-Savegame-Editor.Windows.zip

  release:
    name: Create GitHub Release
    needs: [jar, deb, rpm, dmg, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create Release and Upload Assets
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --prerelease \
            --generate-notes \
            artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}
